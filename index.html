    <img src="buscador-magos/magos-img/14-mago-magia-ritual-john-dee-edward-kelley.jpg" alt="Ebenezer Sibly (diseño) y grabador anónimo, John Dee y Edward Kelley en el círculo mágico de nigromancia, 1784. Grabado calcográfico publicado en A New and Complete Illustration of the Celestial Science of Astrology, Londres (Bodleian Library / Wellcome Collection). Ilustra una de las leyendas más célebres de la magia ritual isabelina del siglo XVI: el matemático, cosmógrafo y astrólogo real de Isabel I, el Dr. John Dee, junto a su médium y alquimista Edward Kelley, pertrechados con grimorios, vara mágica y antorcha en el interior de un círculo consagrado con nombres divinos para conjurar la aparición de un espíritu en el cementerio de Walton-le-Dale. https://wellcomecollection.org/works/m5fswcxj">
    <img src="buscador-magos/magos-img/94-mago-astrology-from-the-tarocchi-series-c-liberal-arts-29-master-of-the-e-series-tarocchi.jpg" alt="Master of the E-Series Tarocchi (Italian, active 1460s), Astrology (from the Tarocchi, series C: Liberal Arts, #29), before 1467. engraving, hand-colored with gold. Cleveland Museum of Art, registro 1924.432.29. Dominio público (CC0 1.0), consultado el 13-10-2026. Here, Astrologia (Astrology) is personified as a winged and full-length female figure, in profile and turned to right. She holds a staff in her right hand, while a starry sphere hovers at the upper right. Astrology teaches the knowledge of the course, movements, and conjunctions of heavens and stars. https://clevelandart.org/art/1924.432.29">
    <img src="buscador-magos/magos-img/34-mago-siglo-xviii-linda-maestra-goya.jpg" alt="Francisco de Goya y Lucientes, ¡Linda maestra! (Los Caprichos, estampa n.º 68), 1799. Aguafuerte, aguatinta bruñida y punta seca sobre papel (21,8 × 15,2 cm), Museo Nacional del Prado, Madrid (G02156). Estampa emblemática de la serie de Los Caprichos: una vieja hechicera adiestra a su joven discípula en el arte de volar sobre una escoba en la oscuridad de la noche, acompañada por el búho de la sabiduría oscura, en una sátira implacable contra la enseñanza de las falsas artes mágicas. https://www.museodelprado.es/coleccion/obra-de-arte/linda-maestra/3421d09e-a0e2-4912-9c90-0f2b31be5d91">
    <img src="buscador-magos/magos-img/32-mago-visionario-hecate-william-blake.jpg" alt="William Blake, La x|noche de la alegría de Enitharmon (anteriormente conocida como Hécate o La triple hechicera), 1795. Estampa en color con tinta y acuarela sobre papel (43,9 × 58,1 cm), Tate Britain, Londres (Catálogo: N05056). Visión mística y mitológica del romanticismo visionario británico: la triple diosa de la magia, Hécate, aparece sentada junto a las criaturas de la noche (búho, murciélago y asno fantástico) con la mano apoyada en un libro de encantamientos prohibidos. https://www.tate.org.uk/art/artworks/blake-the-night-of-enitharmons-joy-formerly-called-hecate-n05056">
    <img src="imagenes/pepito.jpg" alt="pepito paga doble">
    <img src="imagenes/faraday.jpg" alt="Michael Faraday realiza una demostración ante un público numeroso en una sala de conferencias victoriana.">
    <img src="buscador-magos/magos-img/09-mago-siglo-xx-levitacion-kellar.jpg" alt="Harry Kellar, Kellar: The Levitation of Princess Karnac, 1900. Cartel litográfico en color impreso por The Strobridge Lithographing Co., Cincinnati &amp; New York. Library of Congress, Prints and Photographs Division, Washington, D.C. (LCCN 2014636900). Gran cartel publicitario de comienzos del siglo XX que promocionaba la célebre ilusión de levitación escénica desarrollada por Harry Kellar, decano de los magos estadounidenses en la Belle Époque, rodeado de demonios susurrantes en un ambiente de ilusionismo teatral a gran escala. https://www.loc.gov/item/2014636900/">
    <img src="imagenes/gandalf.jpg" alt="A drawing of Gandalf resisting the Trolls, as described in The Hobbit, by J.R.R. Tolkien. https://en.wikipedia.org/wiki/File:Gandalf_from_The_Trolls_are_Turned_to_Stone_-_J.R.R_Tolkien.jpg">
    <img src="buscador-magos/magos-img/02-mago-medieval-merlin-blaise.jpg" alt="Merlín dictando sus profecías a su escriba Blaise, ca. 1300. Miniatura medieval en témpera y pan de oro sobre pergamino, perteneciente al manuscrito en prosa del Roman de Merlin / Lancelot-Graal (Français 95, folio 113v), Bibliothèque nationale de France (BnF), París. El sabio y hechicero legendario Merlín, figura cumbre de la tradición artúrica y de la magia en la Edad Media, aparece como profeta y consejero dictando las crónicas secretas y revelaciones arcanas a su maestro, el ermitaño Blaise. https://gallica.bnf.fr/ark:/12148/btv1b10022284t">
    <img src="buscador-magos/magos-img/25-mago-medieval-caida-simon-mago-benozzo-gozzoli.jpg" alt="Benozzo Gozzoli, La caída de Simón el Mago (The Fall of Simon Magus), 1461–1462. Temple y oro sobre tabla de álamo (24 × 35,5 cm), Royal Collection Trust, Reino Unido (RCIN 403372). Tabla de la predela del retablo de la Compañía de la Purificación de Florencia: narra el enfrentamiento legendario en Roma entre los apóstoles Pedro y Pablo y el mago samaritano Simón el Mago, quien intentó demostrar su poder sobrenatural elevándose por los aires con ayuda de demonios antes de precipitarse al vacío ante el emperador Nerón. https://www.rct.uk/collection/403372/the-fall-of-simon-magus">
    <img src="buscador-magos/magos-img/43-mago-prerrafaelismo-morgan-le-fay-sandys.jpg" alt="Frederick Sandys (Anthony Frederick Augustus Sandys), Morgan le Fay, 1864. Óleo sobre tabla (61,8 × 44,4 cm), Birmingham Museum and Art Gallery, Birmingham, Reino Unido (Accession: 1925P104). Pintura prerrafaelita que retrata a la hechicera artúrica Morgana: iluminada por el fuego ritual de su trípode mágico y ataviada con una piel de leopardo, vierte encantamientos sobre una capa tejida para su hermano, el rey Arturo, mientras consulta tablillas y pergaminos de brujería. https://www.birminghammuseums.org.uk/explore-art/items/1925P104/morgan-le-fay">
    <img src="buscador-magos/magos-img/45-mago-simbolismo-aparicion-gustave-moreau.jpg" alt="Gustave Moreau, La aparición (L&#x27;Apparition), 1876. Óleo sobre lienzo (142 × 103 cm), Musée Gustave Moreau, París / Fogg Art Museum, Harvard University. Arquetipo del simbolismo decadente del siglo XIX: en un palacio oriental profusamente ornamentado con arquitectura mágica y columnas arcanas, Salomé danza semidesnuda ante la visión luminosa y espectral de la cabeza flotante de Juan el Bautista, irradiando halos sobrenaturales en una atmósfera de misticismo hierático. https://collections.louvre.fr/ark:/53355/cl010065261">
    <img src="buscador-magos/magos-img/83-mago-illustrations-for-faust-mephistopheles-visits-faust-eugene-delacroix-french-17981863.jpg" alt="Eugène Delacroix, Méphistophélés visits Faust, litografía de 1828 para la edición francesa de Faust traducida por Albert Stapfer y publicada por Ch. Motte. Mephistopheles visita a Faust en su estudio, donde el erudito rodeado de libros escucha al ser demoníaco que cambiará el rumbo de su vida. Cleveland Museum of Art, registro 1933.145.6. CC0. https://clevelandart.org/art/1933.145.6">
    <img src="buscador-magos/magos-img/47-mago-siglo-xix-kellar-toasts-the-devil.jpg" alt="The Strobridge Lithographing Co., Harry Kellar brinda con el diablo (Harry Kellar toasts the Devil), ca. 1899. Cartel litográfico en color (76 × 101 cm), Library of Congress, Prints and Photographs Division, Washington, D.C. (LCCN 2014636906). Icónico cartel de vodevil victoriano tardío: Harry Kellar, con copa en mano y sonrisa enigmática, intercambia un brindis con un diablo mefistofélico rojo sentado frente a él, sintetizando la fascinación del público de finales del siglo XIX por la ilusión y los espíritus traviesos del escenario. https://www.loc.gov/item/2014636906/">
    <img src="buscador-magos/magos-img/91-mago-in-the-grotto-of-merlin-the-magician-nicolas-delaunay-french-17391792.jpg" alt="Nicolas Delaunay, In the Grotto of Merlin, the Magician, grabado y aguafuerte de 1771 según un diseño de Jean-Michel Moreau le Jeune. La inscripción remite al canto III de Orlando furioso: Bradamante visita la gruta y tumba de Merlin, donde recibe una profecía sobre sus descendientes y la casa de Este. Cleveland Museum of Art, registro 1941.133, CC0. https://clevelandart.org/art/1941.133">
    <img src="imagenes/simon-mago.jpg" alt="Peter&#x27;s conflict with Simon Magus by Avanzino Nucci, 1620. Simon is on the right, wearing black. En el texto cristiano apócrifo de los Hechos de Pedro se narra una de las fantasiosas leyendas más conocidas acerca de Simón el Mago. Allí se dice que Simón exhibía sus poderes mágicos en Roma, volando ante el emperador romano Nerón en el Foro Romano; para probar su condición divina, los apóstoles Pedro y Pablo rogaron a Dios que detuviese su vuelo: Simón paró en seco y cayó a tierra, donde fue apedreado.">
    <img src="imagenes/mago.jpg" alt="Carta del tarot Rider-Waite con el número romano I." class="featured">
    <img src="imagenes/programadora.avif" alt="Margaret Hamilton junto al software de navegación que ella y su equipo MIT produjeron para el Programa Apolo.  https://es.wikipedia.org/wiki/Archivo:Margaret_Hamilton_-_restoration.jpg">
    <img src="buscador-magos/magos-img/26-mago-renacimiento-brujas-unguento-baldung-grien.jpg" alt="Hans Baldung Grien, Dos brujas preparando un ungüento mágico (Zwei Hexen), 1523. Óleo sobre tabla (65,4 × 46 cm), Museum Städel, Fráncfort del Meno. Expresión del Renacimiento alemán sobre la hechicería y las artes mágicas rituales: dos hechiceras desnudas preparan un filtro en una redoma humeante de la que emergen vapores y espíritus, acompañadas por un macho cabrío y un gato sobre un paisaje tormentoso. https://sammlung.staedelmuseum.de/en/work/two-witches">
    <img src="imagenes/heron.png" alt="Louis Figuier (1819–1894). Héron fait l’expérience de l’éolipyle devant les savants de l’École d’Alexandrie. Source Figuier - Les Merveilles de la science, 1867 - 1891, Tome 1.djvu https://commons.wikimedia.org/wiki/File:T1-_d011-_Fig._3_-_H%C3%A9ron_exp%C3%A9rimente_l_%C3%A9olipyle.png">
    <img src="buscador-magos/magos-img/42-mago-simbolismo-circe-invidiosa-waterhouse.jpg" alt="John William Waterhouse, Circe Invidiosa (Circe envenenando el mar), 1892. Óleo sobre lienzo (180,7 × 87,4 cm), Art Gallery of South Australia, Adelaida (Gift of Miss Sarah Elizabeth Roach). Representación de la metamorfosis mítica narrada por Ovidio: la maga Circe, movida por los celos hacia la ninfa Escila, camina sobre las aguas marinas mientras vierte un veneno de color verde intenso en la corriente que transformará a su rival en un monstruo marino aterrador. https://www.agsa.sa.gov.au/collection-publications/collection/works/circe-invidiosa/">
    <img src="imagenes/berg-hoeg.webp" alt="Marie Høeg and Bolette Berg in their home, ca. 1895–1903. For many years, Berg and Høeg ran a successful studio in the naval port of Horten, selling photographs to tourists and travelers, before moving the business to Oslo (then Kristiania) and expanding their remit, publishing postcards, magazines, and reproductions of fine art. When not posing or photographing, they organized on behalf of women. https://publicdomainreview.org/collection/berg-and-hoeg/">
    <img src="buscador-magos/magos-img/15-mago-tarot-marsella-le-bateleur-conver.jpg" alt="Nicolas Conver, Le Bateleur (El Mago / Prestidigitador, Arcano Mayor I del Tarot de Marsella), 1760. Xilografía iluminada con plantilla a mano, Bibliothèque nationale de France (BnF), Département des Estampes et de la photographie, París. El arquetipo fundacional del mago en la tradición cartomántica europea premoderna: un juglar y prestidigitador callejero ataviado con sombrero en forma de lemniscata infinita sostiene una varita mágica ante su mesa de tres patas, donde despliega los implementos clásicos del ilusionismo popular y los cuatro palos esotéricos (dados, monedas, copas y cuchillo). https://gallica.bnf.fr/ark:/12148/btv1b10537494x">
    <img src="imagenes/gottfrid.webp" alt="Gottfrid Svartholm, one of the co-founders of the pirate bay website, at his work station">
    <img src="buscador-magos/magos-img/31-mago-ilustracion-el-charlatan-pietro-longhi.jpg" alt="Pietro Longhi, El charlatán (Il Ciarlatano), 1757. Óleo sobre lienzo (62 × 50 cm), Ca&#x27; Rezzonico, Museo del Settecento Veneziano, Venecia. Documento pictórico del siglo XVIII veneciano que muestra la figura popular del embaucador y mago de plaza pública: subido a un estrado con máscara y capa, realiza pases de manos y ofrece remedios prodigiosos ante caballeros y damas con la tradicional _bauta_ veneciana. https://carezzonico.visitmuve.it/">
    <img src="imagenes/magoenmascarado.webp" alt="El mago enmascarado, personaje de TV del Siglo XXI, quien acostumbraba a revelar sus trucos posterior a comerciales.">
    <img src="buscador-magos/magos-img/03-mago-renacimiento-el-prestidigitador-bosch.jpg" alt="Hieronymus Bosch (El Bosco) o seguidor, El prestidigitador (L&#x27;Escamoteur / The Conjurer), ca. 1496–1502. Óleo sobre tabla, Musée municipal de Saint-Germain-en-Laye, Francia. Obra emblemática del Renacimiento flamenco que retrata el ilusionismo profano y callejero: un prestidigitador realiza el truco de manos con cubiletes y bolitas ante la muchedumbre asombrada, mientras un cómplice aprovecha la distracción del público para sustraer la bolsa de monedas a un espectador embelesado. https://commons.wikimedia.org/wiki/File:Hieronymus_Bosch_(follower)_-_The_Conjurer_(Mus%C3%A9e_Saint-Germain-en-Laye).jpg">
    <img src="buscador-magos/magos-img/29-mago-barroco-laboratorio-alquimista-jan-steen.jpg" alt="Jan Steen, El alquimista o la familia del astrólogo, 1668. Óleo sobre lienzo (73 × 58,5 cm), Ca&#x27; Rezzonico, Venecia / Wallace Collection, Londres. Escena barroca holandesa que retrata con ironía y dramatismo el costo existencial de las artes ocultas: un mago-alquimista continúa absorto ante sus matraces y reactivos mientras su ayudante lee un grimorio y su familia lamenta la ruina económica causada por sus experimentos. https://carezzonico.visitmuve.it/">
    <img src="imagenes/russolo.png" alt="Instrumentos experimentales de ruido construidos por Luigi Russolo para El arte de los ruidos, de 1913; una colección de máquinas sonoras concebidas para producir nuevos sonidos.">
    <img src="buscador-magos/magos-img/13-mago-renacimiento-lo-stregozzo-agostino-veneziano.jpg" alt="Agostino Veneziano (Agostino dei Musi, según Rafael o Giulio Romano), Lo Stregozzo (La procesión de la bruja y los magos nigromantes), ca. 1515–1525. Grabado al buril sobre papel verjurado, The Metropolitan Museum of Art, Nueva York (Accession Number: 49.97.108) / British Museum, Londres. Obra fundamental de la gráfica renacentista italiana sobre magia oscura y nigromancia: una hechicera monta sobre el esqueleto monstruoso de un animal fantástico mientras hechiceros y asistentes desnudos conducen la procesión ceremonial entre cañaverales con antorchas, cuernos y huesos rituales en medio de la noche. https://www.metmuseum.org/art/collection/search/338274">
    <img src="buscador-magos/magos-img/12-mago-renacimiento-maga-melissa-dosso-dossi.jpg" alt="Dosso Dossi (Giovanni di Niccolò de Lutero), Melissa (o Circe), ca. 1518–1531. Óleo sobre lienzo (176 × 174 cm), Galleria Borghese, Roma (Inv. 217). Pintura cumbre del Renacimiento ferrarense inspirada en el Orlando Furioso de Ludovico Ariosto: representa a la maga benevolente Melissa sentada dentro de un círculo mágico de protección decorado con símbolos astrológicos y cabalísticos. Con una antorcha encendida en la mano y una tablilla de conjuros a sus pies, disuelve los encantamientos de la hechicera Alcina para restituir a los caballeros petrificados o convertidos en árboles a su forma humana original. https://collezionegalleriaborghese.it/opere/melissa">
    <img src="buscador-magos/magos-img/05-mago-barroco-fausto-rembrandt.jpg" alt="Rembrandt van Rijn, Un erudito en su estudio contemplando un disco mágico (conocido tradicionalmente como Fausto), ca. 1652. Aguafuerte, punta seca y buril, The Metropolitan Museum of Art, Nueva York (Accession Number: 23.31.21) / Rijksmuseum, Ámsterdam. Una de las cumbres del grabado barroco: un sabio, alquimista y ocultista se pone de pie junto a su mesa de trabajo al irrumpir en su aposento una misteriosa aparición luminosa en forma de disco con un anagrama cabalístico radiante en la ventana, sintetizando el mito fáustico y la búsqueda de la sabiduría esotérica universal. https://www.metmuseum.org/art/collection/search/387498">
    <img src="buscador-magos/magos-img/18-mago-simbolismo-maga-medea-evelyn-de-morgan.jpg" alt="Evelyn De Morgan (nacida Evelyn Pickering), Medea, 1889. Óleo sobre lienzo (148 × 89 cm), Williamson Art Gallery and Museum, Birkenhead, Reino Unido. Destacada obra del simbolismo y prerrafaelismo victoriano tardío que aborda el mito clásico de la hechicera Medea: la princesa de Cólquida y sacerdotisa de Hécate aparece en los aposentos palaciegos vestida con túnica rosa y manto carmesí, sosteniendo en su mano un frasco de vidrio con una poción venenosa brillante mientras reflexiona sobre su trágico destino de magia, amor y venganza. https://victorianweb.org/painting/demorgan/paintings/11.html">
    <img src="imagenes/kite-flying-00068.webp" alt="Katsushika Hokusai&#x27;s illustration of Tomowaka, son of Minamoto no Tametomo, escaping exile aboard a giant kite, from Kyokutei Bakin&#x27;s Chinsetsu Yumiharizuki (Strange Tales of the Crescent Moon), second part, vol. 3, ca. 1808–1809. In Takizawa Bakin’s sixty-eight-chapter serial novel, Chinsetsu Yumiharizuki (Strange Tales of the Crescent Moon, 1807–1811) — richly illustrated by Hokusai — the exiled samurai Minamoto no Tametomo sends his son Tomowaka back to the mainland on a giant kite, in order to become the adopted heir to a samurai leader. Other Japanese annals tell of archers mounted to kites who fire down upon their enemies, and of the bandit Ishikawa Goemon riding a kite to infiltrate Nayoga Castle. https://publicdomainreview.org/collection/art-of-kite-flying/">
    <img src="buscador-magos/magos-img/28-mago-barroco-el-alquimista-david-teniers.jpg" alt="David Teniers el Joven, El alquimista en su laboratorio, ca. 1650. Óleo sobre lienzo (71 × 89 cm), Mauritshuis, La Haya (Inv. 261). Pintura representativa de la Edad de Oro holandesa y flamenca que plasma la figura del alquimista-filósofo trabajando con fuelles, alambiques, crisoles y gruesos volúmenes manuscritos en la búsqueda incesante de la transmutación de los metales. https://www.mauritshuis.nl/en/our-collection/artworks/261-the-alchemist/">
    <img src="buscador-magos/magos-img/16-mago-ilustracion-el-alquimista-wright-of-derby.jpg" alt="Joseph Wright of Derby, El alquimista en busca de la piedra filosofal descubre el fósforo (The Alchymist, In Search of the Philosopher&#x27;s Stone), 1771. Óleo sobre lienzo (127 × 101,6 cm), Derby Museum and Art Gallery, Derby, Reino Unido. Obra maestra del claroscuro en plena Ilustración que capta la encrucijada histórica entre el misticismo arcano del mago-alquimista y los albores de la química moderna: en su laboratorio gótico abovedado, el anciano adepto cae de rodillas asombrado al ver cómo su retorta destila una sustancia incandescente que emite una luz sobrenatural y pura. https://www.derbymuseums.org/collection/item/the-alchymist-in-search-of-the-philosophers-stone-1771">
    <img src="buscador-magos/magos-img/87-mago-the-magician-disguised-as-a-brahman-visits-the-king-of-babylon-from-a-tuti-nama-tales.jpg" alt="Artista desconocido, The magician, disguised as a Brahman, visits the king of Babylon, miniatura del Tuti-nama realizada en la corte mogola de Akbar hacia 1560. El rey sentado en el trono recibe al mago disfrazado de brahmán y a una mujer que, según el relato, es el brahmán transformado; accede a alojarla en su harén. El Cleveland Museum of Art plantea que el rey podría representar a Akbar, aunque la identificación no está resuelta. Registro 1962.279.232.b, CC0. https://clevelandart.org/art/1962.279.232.b">
    <img src="buscador-magos/magos-img/38-mago-renacimiento-retrato-paracelso.jpg" alt="Seguidor de Quentin Matsys, Retrato de Philippus Theophrastus Paracelsus, ca. 1540. Óleo sobre tabla (72 × 54 cm), Musée du Louvre, París (Inv. 1976). Retrato de Theophrastus von Hohenheim, conocido como Paracelso (1493–1541), revolucionario médico, botánico, alquimista y astrólogo suizo que reformuló la medicina a partir de la filosofía hermética, la doctrina de las signaturas y la transmutación mineral. https://collections.louvre.fr/ark:/53355/cl010065005">
    <img src="buscador-magos/magos-img/76-mago-the-deities-demogorgon-in-the-cave-of-eternity-hendrick-goltzius-dutch-15581617.jpg" alt="Hendrick Goltzius (Dutch, 1558–1617), The Deities: Demogorgon in the Cave of Eternity, 1588–90. chiaroscuro woodcut. Cleveland Museum of Art, registro 1952.204. Dominio público (CC0 1.0), consultado el 13-10-2026. Not all witches were women; men also performed magic. Unlike the destructive and sexualized stereotypes of female witches, male magicians were likened to the philosophers, alchemists, or heroic scientists of the Renaissance. In Goltzius&#x27;s print, which was so popular it was reprinted as late as the 19th century, the central male figure is Demogorgon, the omnipotent father of all gods. Although Demogorgon was feared as the &quot;Demon-gorgon,&quot; a terror who could unleash his primordial power, Goltzius portrays the god as a wizened and magical force who uses his power to give form to the world. https://clevelandart.org/art/1952.204">
    <img src="buscador-magos/magos-img/92-mago-the-roman-courtesan-or-the-revenge-of-the-sorcerer-virgil-albrecht-altdorfer-german-c.jpg" alt="Albrecht Altdorfer (German, c. 1480–1538), The Roman Courtesan or The Revenge of the Sorcerer Virgil, 1520–1526. engraving. Cleveland Museum of Art, registro 1946.391. Dominio público (CC0 1.0), consultado el 13-10-2026. Representa una leyenda medieval sobre el poeta Virgilio (visto en la tradición como un mago), en la que una cortesana de Roma lo humilla dejándolo colgado en una cesta, y él se venga haciendo que todo el fuego de la ciudad se apague, de modo que los ciudadanos deben acudir a encender sus antorchas de una manera peculiar desde ella. https://clevelandart.org/art/1946.391">
    <img src="imagenes/cornelius.jpg" alt="Three Books of Occult Philosophy (1533), Heinrich Cornelius Agrippa. Los tres libros de filosofía oculta es una enciclopedia de magia renacentista dividida en tres niveles: la magia natural (elementos, plantas, piedras), la celeste (astrología y números) y la ceremonial (ángeles y cábala cristiana). Sintetiza el hermetismo y el neoplatonismo, y es clave para entender la historia del esoterismo occidental. La portada es el cuadro &quot;Ein Sterbender empfielt seine Seele Gott&quot; (el alma moribunda se encomienda a Dios) de Maestro de Heiligenkreuz https://an.wikipedia.org/wiki/Imachen:Meister_von_Heiligenkreuz_001.jpg">

  </div>

  <div class="modal" id="modal">
    <figure class="modal-figure">
      <img id="modal-img" src="" alt="">
      <figcaption id="modal-caption"></figcaption>
    </figure>
  </div>

  <script>
    function updateMosaic() {
      const mosaic = document.getElementById('mosaic');
      if (!mosaic) return;

      const items = Array.from(mosaic.querySelectorAll('img'));
      const count = items.length;
      if (!count) return;

      const w = window.innerWidth;
      const h = window.innerHeight;

      // Find the optimal number of columns and rows to fill the screen
      // targeting a balanced cell aspect ratio (~1.2 - 1.4)
      let bestCols = 1;
      let bestRows = count;
      let bestScore = Infinity;
      const targetAspect = 1.33;

      for (let cols = 1; cols <= count; cols++) {
        const rows = Math.ceil(count / cols);
        const cellW = w / cols;
        const cellH = h / rows;
        const aspect = cellW / cellH;

        // Balance aspect ratio close to target and minimize empty slots
        const aspectScore = Math.abs(Math.log(aspect / targetAspect));
        const emptySlots = (cols * rows) - count;
        const emptyScore = (emptySlots / count) * 0.4;
        const score = aspectScore + emptyScore;

        if (score < bestScore) {
          bestScore = score;
          bestCols = cols;
          bestRows = rows;
        }
      }

      mosaic.style.gridTemplateColumns = `repeat(${bestCols}, minmax(0, 1fr))`;
      mosaic.style.gridTemplateRows = `repeat(${bestRows}, minmax(0, 1fr))`;

      // Keep the Rider-Waite Magician in the central grid cell.
      items.forEach(item => {
        item.style.gridColumn = '';
        item.style.gridRow = '';
      });
      const featured = mosaic.querySelector('.featured');
      if (featured) {
        const centerColumn = Math.ceil(bestCols / 2);
        const centerRow = Math.ceil(bestRows / 2);
        featured.style.gridColumn = bestCols % 2 === 0
          ? `${centerColumn} / span 2`
          : String(centerColumn);
        featured.style.gridRow = bestRows % 2 === 0
          ? `${centerRow} / span 2`
          : String(centerRow);
      }
    }

    // Auto-update on resize
    window.addEventListener('resize', updateMosaic);

    // Auto-update when DOM is ready
    window.addEventListener('DOMContentLoaded', updateMosaic);

    // Auto-update if images are dynamically added or removed
    const observer = new MutationObserver(updateMosaic);
    const mosaicEl = document.getElementById('mosaic');
    if (mosaicEl) {
      observer.observe(mosaicEl, { childList: true });
    }

    // Modal interactions
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');

    if (mosaicEl && modal && modalImg) {
      mosaicEl.addEventListener('click', (e) => {
        const targetImg = e.target.closest('img');
        if (targetImg) {
          modalImg.src = targetImg.src;
          modalImg.alt = targetImg.alt || '';
          if (modalCaption) {
            modalCaption.textContent = targetImg.alt || '';
            modalCaption.style.display = targetImg.alt ? 'block' : 'none';
          }
          modal.classList.add('active');
        }
      });

      modal.addEventListener('click', () => {
        modal.classList.remove('active');
        modalImg.src = '';
        if (modalCaption) modalCaption.textContent = '';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          modal.classList.remove('active');
          modalImg.src = '';
          if (modalCaption) modalCaption.textContent = '';
        }
      });
    }

    updateMosaic();
  </script>
</body>
