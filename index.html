    <img src="buscador-magos//magos-img/14-mago-magia-ritual-john-dee-edward-kelley.jpg" alt="Ebenezer Sibly (diseño) y grabador anónimo, John Dee y Edward Kelley en el círculo mágico de nigromancia, 1784. Grabado calcográfico publicado en A New and Complete Illustration of the Celestial Science of Astrology, Londres (Bodleian Library / Wellcome Collection). Ilustra una de las leyendas más célebres de la magia ritual isabelina del siglo XVI: el matemático, cosmógrafo y astrólogo real de Isabel I, el Dr. John Dee, junto a su médium y alquimista Edward Kelley, pertrechados con grimorios, vara mágica y antorcha en el interior de un círculo consagrado con nombres divinos para conjurar la aparición de un espíritu en el cementerio de Walton-le-Dale. https://wellcomecollection.org/works/m5fswcxj">

    <img src="buscador-magos/magos-img/03-mago-renacimiento-el-prestidigitador-bosch.jpg" alt="Hieronymus Bosch (El Bosco) o seguidor, El prestidigitador (L&#x27;Escamoteur / The Conjurer), ca. 1496–1502. Óleo sobre tabla, Musée municipal de Saint-Germain-en-Laye, Francia. Obra emblemática del Renacimiento flamenco que retrata el ilusionismo profano y callejero: un prestidigitador realiza el truco de manos con cubiletes y bolitas ante la muchedumbre asombrada, mientras un cómplice aprovecha la distracción del público para sustraer la bolsa de monedas a un espectador embelesado. https://commons.wikimedia.org/wiki/File:Hieronymus_Bosch_(follower)_-_The_Conjurer_(Mus%C3%A9e_Saint-Germain-en-Laye).jpg">
    <img src="buscador-magos//magos-img/09-mago-siglo-xx-levitacion-kellar.jpg" alt="Harry Kellar, Kellar: The Levitation of Princess Karnac, 1900. Cartel litográfico en color impreso por The Strobridge Lithographing Co., Cincinnati &amp; New York. Library of Congress, Prints and Photographs Division, Washington, D.C. (LCCN 2014636900). Gran cartel publicitario de comienzos del siglo XX que promocionaba la célebre ilusión de levitación escénica desarrollada por Harry Kellar, decano de los magos estadounidenses en la Belle Époque, rodeado de demonios susurrantes en un ambiente de ilusionismo teatral a gran escala. https://www.loc.gov/item/2014636900/">

    <img src="imagenes/simon-mago.jpg" alt="Peter&#x27;s conflict with Simon Magus by Avanzino Nucci, 1620. Simon is on the right, wearing black. En el texto cristiano apócrifo de los Hechos de Pedro se narra una de las fantasiosas leyendas más conocidas acerca de Simón el Mago. Allí se dice que Simón exhibía sus poderes mágicos en Roma, volando ante el emperador romano Nerón en el Foro Romano; para probar su condición divina, los apóstoles Pedro y Pablo rogaron a Dios que detuviese su vuelo: Simón paró en seco y cayó a tierra, donde fue apedreado.">

    <img src="buscador-magos//magos-img/07-mago-siglo-xix-circulo-magico-waterhouse.jpg" alt="John William Waterhouse, El círculo mágico (The Magic Circle), 1886. Óleo sobre lienzo (183 × 127 cm), Tate Britain, Londres (Número de catálogo: N01572). Obra maestra del simbolismo y prerrafaelismo tardío del siglo XIX: una hechicera traza en la arena un círculo protector con su varita ardiente mientras sostiene una hoz lunar y cocina un brebaje en un caldero humeante bajo el vuelo de cuervos, evocando la fascinación romántica por la brujería ceremonial y los mitos clásicos. https://www.tate.org.uk/art/artworks/waterhouse-the-magic-circle-n01572">

    <img src="buscador-magos//magos-img/12-mago-renacimiento-maga-melissa-dosso-dossi.jpg" alt="Dosso Dossi (Giovanni di Niccolò de Lutero), Melissa (o Circe), ca. 1518–1531. Óleo sobre lienzo (176 × 174 cm), Galleria Borghese, Roma (Inv. 217). Pintura cumbre del Renacimiento ferrarense inspirada en el Orlando Furioso de Ludovico Ariosto: representa a la maga benevolente Melissa sentada dentro de un círculo mágico de protección decorado con símbolos astrológicos y cabalísticos. Con una antorcha encendida en la mano y una tablilla de conjuros a sus pies, disuelve los encantamientos de la hechicera Alcina para restituir a los caballeros petrificados o convertidos en árboles a su forma humana original. https://collezionegalleriaborghese.it/opere/melissa">

    <img src="imagenes/benoit.webp" alt="Joseph Benoît Suvée, The Invention of the Art of Drawing, ca. 1791. &quot;George Didi-Huberman has demonstrated how these secular images of representation have a predecessor in Christian icons known as acheiropoieton (made without hands), like the Manoppelo Image and the Holy Shroud of Turin, miraculously emblazoned with the face of Jesus Christ, as if his shadow could leave a stain. “What has touched the god often becomes untouchable par excellence”, he writes, “it withdraws into the shadow of the mystery (and is constituted forever as an object of desire).” https://publicdomainreview.org/collection/origins-of-painting/">

    <img src="imagenes/kite-flying-00068.webp" alt="Katsushika Hokusai&#x27;s illustration of Tomowaka, son of Minamoto no Tametomo, escaping exile aboard a giant kite, from Kyokutei Bakin&#x27;s Chinsetsu Yumiharizuki (Strange Tales of the Crescent Moon), second part, vol. 3, ca. 1808–1809. In Takizawa Bakin’s sixty-eight-chapter serial novel, Chinsetsu Yumiharizuki (Strange Tales of the Crescent Moon, 1807–1811) — richly illustrated by Hokusai — the exiled samurai Minamoto no Tametomo sends his son Tomowaka back to the mainland on a giant kite, in order to become the adopted heir to a samurai leader. Other Japanese annals tell of archers mounted to kites who fire down upon their enemies, and of the bandit Ishikawa Goemon riding a kite to infiltrate Nayoga Castle. https://publicdomainreview.org/collection/art-of-kite-flying/">

  </div>

  <div class="modal" id="modal">
    <figure class="modal-figure">
      <img id="modal-img" src="" alt="">
      <figcaption id="modal-caption"></figcaption>
    </figure>
  </div>

  <script>
    function updateMosaic() {
      const mosaic = document.getElementById('mosaic');
      if (!mosaic) return;

      const items = Array.from(mosaic.querySelectorAll('img'));
      const count = items.length;
      if (!count) return;

      const w = window.innerWidth;
      const h = window.innerHeight;

      // Find the optimal number of columns and rows to fill the screen
      // targeting a balanced cell aspect ratio (~1.2 - 1.4)
      let bestCols = 1;
      let bestRows = count;
      let bestScore = Infinity;
      const targetAspect = 1.33;

      for (let cols = 1; cols <= count; cols++) {
        const rows = Math.ceil(count / cols);
        const cellW = w / cols;
        const cellH = h / rows;
        const aspect = cellW / cellH;

        // Balance aspect ratio close to target and minimize empty slots
        const aspectScore = Math.abs(Math.log(aspect / targetAspect));
        const emptySlots = (cols * rows) - count;
        const emptyScore = (emptySlots / count) * 0.4;
        const score = aspectScore + emptyScore;

        if (score < bestScore) {
          bestScore = score;
          bestCols = cols;
          bestRows = rows;
        }
      }

      mosaic.style.gridTemplateColumns = `repeat(${bestCols}, minmax(0, 1fr))`;
      mosaic.style.gridTemplateRows = `repeat(${bestRows}, minmax(0, 1fr))`;

      // Reset spans for all items
      items.forEach(item => {
        item.style.gridColumn = '';
      });

      // Distribute any remainder across the last row items so every column is filled
      const lastRowCount = count - (bestRows - 1) * bestCols;
      if (lastRowCount > 0 && lastRowCount < bestCols) {
        const baseSpan = Math.floor(bestCols / lastRowCount);
        const remainder = bestCols % lastRowCount;
        const startIndex = (bestRows - 1) * bestCols;

        for (let i = 0; i < lastRowCount; i++) {
          const item = items[startIndex + i];
          if (item) {
            const span = baseSpan + (i < remainder ? 1 : 0);
            if (span > 1) {
              item.style.gridColumn = `span ${span}`;
            }
          }
        }
      }
    }

    // Auto-update on resize
    window.addEventListener('resize', updateMosaic);

    // Auto-update when DOM is ready
    window.addEventListener('DOMContentLoaded', updateMosaic);

    // Auto-update if images are dynamically added or removed
    const observer = new MutationObserver(updateMosaic);
    const mosaicEl = document.getElementById('mosaic');
    if (mosaicEl) {
      observer.observe(mosaicEl, { childList: true });
    }

    // Modal interactions
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');

    if (mosaicEl && modal && modalImg) {
      mosaicEl.addEventListener('click', (e) => {
        const targetImg = e.target.closest('img');
        if (targetImg) {
          modalImg.src = targetImg.src;
          modalImg.alt = targetImg.alt || '';
          if (modalCaption) {
            modalCaption.textContent = targetImg.alt || '';
            modalCaption.style.display = targetImg.alt ? 'block' : 'none';
          }
          modal.classList.add('active');
        }
      });

      modal.addEventListener('click', () => {
        modal.classList.remove('active');
        modalImg.src = '';
        if (modalCaption) modalCaption.textContent = '';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          modal.classList.remove('active');
          modalImg.src = '';
          if (modalCaption) modalCaption.textContent = '';
        }
      });
    }

    updateMosaic();
  </script>
</body>
</html>
