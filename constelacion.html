<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constelación</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.3.6/dist/style.css">
  <style>
    #constelacion {
      width: 100vw;
      height: 100vh;
    }

    #constelacion .react-flow {
      --xy-background-color: transparent;
      --xy-edge-stroke: #e0e0e0;
      --xy-edge-stroke-width: 1.5;
    }

    .controles {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }

    .controles a,
    .controles button {
      padding: 6px 9px;
      border: 0;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      font: 14px/1.2 system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .controles a:hover,
    .controles button:hover {
      text-decoration: underline;
    }

    .burbuja {
      position: relative;
      display: block;
      padding: 0;
      border: 2px solid #e0e0e0;
      border-radius: 50%;
      background: #000 center / cover no-repeat;
      cursor: pointer;
    }

    .burbuja:hover,
    .burbuja:focus-visible {
      border-color: #fff;
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* Fuera del flujo para que no altere la medida (y el centro) del nodo. */
    .burbuja-titulo {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      width: 180px;
      transform: translateX(-50%);
      color: #e0e0e0;
      font: 12px/1.3 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    .controles {
      right: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controles .sep {
      width: 12px;
    }

    .controles button.activo {
      color: #000;
      background: #e0e0e0;
    }

    .burbuja.origen {
      border-color: #fff;
      border-width: 3px;
    }

    .etiqueta {
      color: #888;
      font: 600 22px/1.2 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      width: 300px;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .lienzo {
      width: 100%;
      height: 100%;
    }

    .lienzo.con-lectura {
      width: calc(100% - 400px);
    }

    .lectura {
      position: fixed;
      top: 56px;
      right: 0;
      bottom: 0;
      z-index: 10;
      width: 400px;
      overflow-y: auto;
      padding: 16px 20px 24px;
      color: #e0e0e0;
      background: #0b0b0b;
      border-left: 1px solid #333;
      font: 14px/1.55 system-ui, sans-serif;
    }

    @media (max-width: 760px) {
      .lienzo.con-lectura {
        width: 100%;
        height: 55%;
      }

      .lectura {
        top: auto;
        left: 0;
        width: 100%;
        height: 45%;
        border-left: 0;
        border-top: 1px solid #333;
      }
    }

    .lectura h2 {
      margin-bottom: 4px;
      font-size: 15px;
      color: #fff;
    }

    .lectura .modo {
      margin-bottom: 10px;
      color: #888;
      font-size: 12px;
    }

    .lectura p + p {
      margin-top: 8px;
    }

    .arista-texto {
      position: absolute;
      z-index: 1000; /* sobre las burbujas */
      padding: 2px 6px;
      color: #fff;
      background: #000;
      border: 1px solid #555;
      font: italic 12px/1.2 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "@xyflow/react": "https://esm.sh/@xyflow/react@12.3.6?external=react,react-dom",
      "htm": "https://esm.sh/htm@3.1.1",
      "marked": "https://esm.sh/marked@15.0.12"
    }
  }
  </script>
</head>
<body>
  <div id="constelacion"></div>

  <!-- Modal (mismo que en index.html) -->
  <div class="modal" id="modal">
    <figure class="modal-figure">
      <img id="modal-img" src="" alt="">
      <figcaption id="modal-caption"></figcaption>
    </figure>
  </div>

  <script type="module">
    import { createElement, useState } from "react";
    import { createRoot } from "react-dom/client";
    import {
      ReactFlow,
      Handle,
      Position,
      BaseEdge,
      EdgeLabelRenderer,
      MarkerType,
      useInternalNode,
      useNodesState,
    } from "@xyflow/react";
    import htm from "htm";
    import { marked } from "marked";

    const html = htm.bind(createElement);

    const SIZE = 150;
    const SIZE_ORIGEN = 200;
    const SEPARACION = SIZE + 90;
    const COLOR = "#e0e0e0";
    const ORIGEN = "mago"; // toda constelación parte de la carta de Rider-Waite

    // Propuestas de constelación. "constelacion.md" es la de trabajo.
    const PROPUESTAS = [
      { id: "inicial", nombre: "Inicial", archivo: "constelacion.md" },
      { id: "manos", nombre: "Manos", archivo: "constelaciones/manos.md" },
      { id: "castigo", nombre: "Castigo", archivo: "constelaciones/castigo.md" },
      { id: "genero", nombre: "Género", archivo: "constelaciones/genero.md" },
      { id: "virtud", nombre: "Virtud y vicio", archivo: "constelaciones/virtud.md" },
      { id: "aparecer", nombre: "Contra la línea", archivo: "constelaciones/aparecer.md" },
      { id: "mesa", nombre: "Mesa", archivo: "constelaciones/mesa.md" },
    ];

    const MODOS = {
      aleatorio: "disposición aleatoria",
      radial: "radial: anillos según la distancia a la carta",
      columnas: "columnas por grupo",
      filas: "filas por grupo",
      linea: "línea de tiempo (para romperla)",
    };

    const norm = (t) =>
      t.normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase();

    const sinBarra = (r) => r.trim().replace(/^\.\//, "");

    // Bloques "## nombre" de un markdown.
    function bloques(md) {
      return md
        .split(/^## /m)
        .slice(1)
        .map((b) => {
          const [titulo, ...resto] = b.split("\n");
          return { titulo: titulo.trim(), cuerpo: resto.join("\n").trim() };
        });
    }

    // Catálogo de imagenes.md: cada "## nombre" con su imagen, incluidas las
    // comentadas (comentar solo las oculta del mosaico).
    function parsearCatalogo(md) {
      const catalogo = new Map();
      for (const { titulo, cuerpo } of bloques(md.replace(/<[!]--|-->/g, ""))) {
        const img = cuerpo.match(/!\[([\s\S]*?)\]\(([^)]*)\)/);
        if (!img) continue;
        catalogo.set(norm(titulo), {
          titulo,
          alt: img[1].trim(),
          src: sinBarra(img[2]),
          texto: img[1].trim(),
        });
      }
      return catalogo;
    }

    // Líneas "A -> B : texto", "A <-> B", "A <- B", "A -- B".
    function parsearConexiones(cuerpo) {
      const out = [];
      for (const linea of cuerpo.split("\n")) {
        const m = linea
          .replace(/^\s*[-*+]\s+/, "")
          .match(/^(.+?)\s+(<->|->|<-|--)\s+(.+?)(?:\s+:\s*(.+))?$/);
        if (m) out.push({ a: norm(m[1]), flecha: m[2], b: norm(m[3]), texto: m[4]?.trim(), linea });
      }
      return out;
    }

    // Líneas "- etiqueta: a, b, c".
    function parsearGrupos(cuerpo) {
      const out = [];
      for (const linea of cuerpo.split("\n")) {
        const m = linea.replace(/^\s*[-*+]\s+/, "").match(/^(.+?):\s*(.+)$/);
        if (m) out.push({ etiqueta: m[1].trim(), miembros: m[2].split(",").map(norm).filter(Boolean) });
      }
      return out;
    }

    // Una propuesta: preámbulo con "# título" y "modo: x"; secciones especiales
    // "Lectura", "Conexiones" y "Grupos"; cualquier otro "## nombre" con imagen
    // define (o redefine) ese nodo. Los nodos que solo se nombran en conexiones o
    // grupos se buscan en imagenes.md.
    function parsear(md, catalogo) {
      md = md.replace(/<[!]--[\s\S]*?-->/g, "");
      const preambulo = md.split(/^## /m)[0];
      const titulo = preambulo.match(/^# (.+)$/m)?.[1].trim() ?? "";
      const modo = preambulo.match(/^modo:\s*(\S+)/m)?.[1] ?? "aleatorio";
      const bs = bloques(md);
      const especial = (n) => bs.find((b) => norm(b.titulo) === n);
      const lectura = especial("lectura")?.cuerpo ?? "";
      const conexiones = parsearConexiones(especial("conexiones")?.cuerpo ?? "");
      const grupos = parsearGrupos(especial("grupos")?.cuerpo ?? "");

      const items = new Map();
      for (const { titulo: t, cuerpo } of bs) {
        if (["lectura", "conexiones", "grupos"].includes(norm(t))) continue;
        const img = cuerpo.match(/!\[(.*?)\]\((.*?)\)/);
        if (!img) {
          console.warn("Sin imagen:", t);
          continue;
        }
        items.set(norm(t), {
          id: norm(t),
          titulo: t,
          alt: img[1].trim(),
          src: sinBarra(img[2]),
          texto: cuerpo.replace(img[0], "").trim() || img[1].trim(),
        });
      }
      const nombres = [
        ORIGEN,
        ...grupos.flatMap((g) => g.miembros),
        ...conexiones.flatMap((c) => [c.a, c.b]),
      ];
      for (const n of nombres) {
        if (items.has(n)) continue;
        const c = catalogo.get(n);
        if (c) items.set(n, { id: n, ...c });
        else if (n !== ORIGEN) console.warn("Nombre desconocido:", n);
      }

      const edges = [];
      for (const { a, flecha, b, texto, linea } of conexiones) {
        if (!items.has(a) || !items.has(b)) {
          console.warn("Conexión con nombre desconocido:", linea);
          continue;
        }
        const marca = { type: MarkerType.ArrowClosed, color: COLOR };
        edges.push({
          id: a + "-" + b + "-" + edges.length,
          source: a,
          target: b,
          type: "flotante",
          label: texto,
          markerStart: flecha.startsWith("<") ? marca : undefined,
          markerEnd: flecha.endsWith(">") ? marca : undefined,
        });
      }
      // La carta va siempre primero: es el origen de toda disposición.
      const lista = [...items.values()].sort((x, y) => (y.id === ORIGEN) - (x.id === ORIGEN));
      return { titulo, modo, lectura, items: lista, edges, grupos };
    }

    // --- Disposiciones (posiciones por el centro de cada burbuja) ---

    const barajar = (xs) => {
      const a = [...xs];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    // Aleatoria sin superposición; la carta queda en el centro.
    function posicionesAleatorias(n) {
      const mitad = Math.max(SEPARACION, Math.sqrt(n) * SEPARACION * 0.8);
      for (let intento = 0; intento < 200; intento++) {
        const pts = [{ x: 0, y: 0 }];
        let tope = 0;
        while (pts.length < n && tope++ < 500) {
          const p = {
            x: (Math.random() * 2 - 1) * mitad,
            y: (Math.random() * 2 - 1) * mitad,
          };
          if (pts.every((q) => Math.hypot(p.x - q.x, p.y - q.y) >= SEPARACION))
            pts.push(p);
        }
        if (pts.length === n) return pts;
      }
      return Array.from({ length: n }, (_, i) => {
        if (i === 0) return { x: 0, y: 0 };
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / (n - 1);
        return { x: Math.cos(a) * 400, y: Math.sin(a) * 400 };
      });
    }

    function aleatoria(ids) {
      const pts = posicionesAleatorias(ids.length);
      return { pos: new Map(ids.map((id, i) => [id, pts[i]])), etiquetas: [] };
    }

    // Anillos según la distancia (en conexiones) a la carta.
    function radial(ids, edges, barajado) {
      const vecinos = new Map(ids.map((id) => [id, []]));
      for (const e of edges) {
        vecinos.get(e.source).push(e.target);
        vecinos.get(e.target).push(e.source);
      }
      const dist = new Map([[ids[0], 0]]);
      const cola = [ids[0]];
      while (cola.length) {
        const u = cola.shift();
        for (const v of vecinos.get(u))
          if (!dist.has(v)) {
            dist.set(v, dist.get(u) + 1);
            cola.push(v);
          }
      }
      const maxD = Math.max(0, ...dist.values());
      const anillos = [];
      for (const id of ids.slice(1)) {
        const d = dist.get(id) ?? maxD + 1;
        (anillos[d] ??= []).push(id);
      }
      const pos = new Map([[ids[0], { x: 0, y: 0 }]]);
      let r = 0;
      anillos.forEach((anillo, d) => {
        if (!anillo) return;
        r = Math.max(r + SEPARACION * 1.5, (anillo.length * SEPARACION * 1.3) / (2 * Math.PI));
        const giro = barajado ? Math.random() * 2 * Math.PI : -Math.PI / 2 + d * 0.4;
        const orden = barajado ? barajar(anillo) : anillo;
        orden.forEach((id, i) => {
          const a = giro + (i * 2 * Math.PI) / orden.length;
          pos.set(id, { x: Math.cos(a) * r, y: Math.sin(a) * r });
        });
      });
      return { pos, etiquetas: [] };
    }

    // Grupos en el orden en que se declaran; lo que no tiene grupo va al final.
    function agrupar(ids, grupos) {
      const usados = new Set([ids[0]]);
      const out = grupos.map((g) => ({
        etiqueta: g.etiqueta,
        miembros: g.miembros.filter((m) => ids.includes(m) && !usados.has(m) && usados.add(m)),
      }));
      const resto = ids.filter((id) => !usados.has(id));
      if (resto.length) out.push({ etiqueta: "otros", miembros: resto });
      return out.filter((g) => g.miembros.length);
    }

    function columnas(ids, grupos, barajado, vertical) {
      const gs = agrupar(ids, grupos);
      const paso = SEPARACION * 1.4;
      const max = Math.max(...gs.map((g) => g.miembros.length));
      const pos = new Map([[ids[0], { x: 0, y: 0 }]]);
      const etiquetas = [];
      gs.forEach((g, i) => {
        const orden = barajado ? barajar(g.miembros) : g.miembros;
        const eje = (i + 1) * paso;
        orden.forEach((id, j) => {
          const t = (j - (orden.length - 1) / 2) * SEPARACION;
          pos.set(id, vertical ? { x: t, y: eje } : { x: eje, y: t });
        });
        const borde = ((max - 1) / 2) * SEPARACION + SIZE;
        etiquetas.push({
          texto: g.etiqueta,
          ...(vertical ? { x: -borde - 40, y: eje } : { x: eje, y: -borde }),
          alinear: vertical ? "derecha" : "centro",
        });
      });
      return { pos, etiquetas };
    }

    // Una sola línea en zigzag, grupo tras grupo.
    function linea(ids, grupos, barajado) {
      const gs = agrupar(ids, grupos);
      const pos = new Map([[ids[0], { x: 0, y: 0 }]]);
      const etiquetas = [];
      let x = 0;
      let k = 0;
      for (const g of gs) {
        x += SEPARACION * 0.6;
        const desde = x + SEPARACION * 0.7;
        const orden = barajado ? barajar(g.miembros) : g.miembros;
        for (const id of orden) {
          x += SEPARACION * 0.7;
          pos.set(id, { x, y: (k++ % 2 ? 1 : -1) * SEPARACION * 0.55 });
        }
        etiquetas.push({ texto: g.etiqueta, x: (desde + x) / 2, y: -SEPARACION * 1.6, alinear: "centro" });
      }
      return { pos, etiquetas };
    }

    function disponer(modo, items, edges, grupos, barajado) {
      const ids = items.map((it) => it.id);
      if (modo === "radial") return radial(ids, edges, barajado);
      if (modo === "columnas") return columnas(ids, grupos, barajado, false);
      if (modo === "filas") return columnas(ids, grupos, barajado, true);
      if (modo === "linea") return linea(ids, grupos, barajado);
      return aleatoria(ids);
    }

    // --- Arista (portada de proyectoD/diagrama/src/Arista.jsx) ---

    function formaAleatoria() {
      const n = 1 + Math.floor(Math.random() * 2);
      return Array.from({ length: n }, (_, i) => ({
        t: (i + 1) / (n + 1),
        off: (Math.random() * 0.5 - 0.25) * (i % 2 ? -1 : 1),
      }));
    }

    // Curva suave (Catmull-Rom convertida a bézier cúbico) por todos los puntos.
    function curva(p1, p2, forma) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d;
      const ny = dx / d;
      const pts = [
        p1,
        ...forma.map(({ t, off }) => ({
          x: p1.x + dx * t + nx * off * d,
          y: p1.y + dy * t + ny * off * d,
        })),
        p2,
      ];
      const segs = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[Math.max(i - 1, 0)];
        const b = pts[i];
        const c = pts[i + 1];
        const e = pts[Math.min(i + 2, pts.length - 1)];
        segs.push([
          b,
          { x: b.x + (c.x - a.x) / 6, y: b.y + (c.y - a.y) / 6 },
          { x: c.x - (e.x - b.x) / 6, y: c.y - (e.y - b.y) / 6 },
          c,
        ]);
      }
      const path =
        "M" + p1.x + "," + p1.y +
        segs.map(([, c1, c2, c]) => " C" + c1.x + "," + c1.y + " " + c2.x + "," + c2.y + " " + c.x + "," + c.y).join("");
      // Punto medio de la curva: mitad del segmento central.
      const [b, c1, c2, c] = segs[Math.floor(segs.length / 2)];
      const u = segs.length % 2 ? 0.5 : 0;
      const mt = 1 - u;
      const mid = (k) =>
        mt ** 3 * b[k] + 3 * mt ** 2 * u * c1[k] + 3 * mt * u ** 2 * c2[k] + u ** 3 * c[k];
      return [path, mid("x"), mid("y")];
    }

    // Punto del borde del círculo `nodo` en dirección a `otro`.
    function borde(nodo, otro) {
      const centro = (n) => ({
        x: n.internals.positionAbsolute.x + n.measured.width / 2,
        y: n.internals.positionAbsolute.y + n.measured.height / 2,
      });
      const a = centro(nodo);
      const b = centro(otro);
      const r = nodo.measured.width / 2;
      const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      return { x: a.x + ((b.x - a.x) / d) * r, y: a.y + ((b.y - a.y) / d) * r };
    }

    function Arista({ id, source, target, markerStart, markerEnd, label }) {
      const [forma] = useState(formaAleatoria);
      const s = useInternalNode(source);
      const t = useInternalNode(target);
      if (!s?.measured?.width || !t?.measured?.width) return null;
      const p1 = borde(s, t);
      const p2 = borde(t, s);
      const [path, lx, ly] = curva(p1, p2, forma);
      return html`
        <${BaseEdge} id=${id} path=${path} markerStart=${markerStart} markerEnd=${markerEnd} />
        ${label && html`
          <${EdgeLabelRenderer}>
            <div
              className="arista-texto"
              style=${{ transform: "translate(-50%, -50%) translate(" + lx + "px, " + ly + "px)" }}
            >${label}</div>
          <//>
        `}
      `;
    }

    // --- Nodos ---

    const oculto = { opacity: 0, top: "50%", left: "50%", pointerEvents: "none" };

    function Burbuja({ data }) {
      return html`
        <button
          type="button"
          className=${"burbuja" + (data.origen ? " origen" : "")}
          style=${{ width: data.size, height: data.size, backgroundImage: "url(" + JSON.stringify(data.src) + ")" }}
          aria-label=${data.alt}
          onClick=${data.onClick}
        >
          <${Handle} type="target" position=${Position.Top} style=${oculto} />
          <${Handle} type="source" position=${Position.Top} style=${oculto} />
          <span className="burbuja-titulo">${data.titulo}</span>
        </button>
      `;
    }

    function Etiqueta({ data }) {
      const transform =
        data.alinear === "derecha" ? "translate(-100%, -50%)" : "translate(-50%, -50%)";
      const textAlign = data.alinear === "derecha" ? "right" : "center";
      return html`<div className="etiqueta" style=${{ transform, textAlign }}>${data.texto}</div>`;
    }

    const nodeTypes = { burbuja: Burbuja, etiqueta: Etiqueta };
    const edgeTypes = { flotante: Arista };

    function Diagrama({ nodes: iniciales, edges }) {
      const [nodes, , onNodesChange] = useNodesState(
        iniciales.map((n) => ({
          ...n,
          position: {
            x: n.position.x - (n.data.size ?? 0) / 2,
            y: n.position.y - (n.data.size ?? 0) / 2,
          },
        }))
      );
      return html`
        <${ReactFlow}
          nodes=${nodes}
          edges=${edges}
          nodeTypes=${nodeTypes}
          edgeTypes=${edgeTypes}
          onNodesChange=${onNodesChange}
          fitView
          fitViewOptions=${{ padding: 0.15 }}
          minZoom=${0.05}
          nodesConnectable=${false}
          elementsSelectable=${false}
          proOptions=${{ hideAttribution: true }}
        />
      `;
    }

    // --- Modal ---

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");
    const modalCaption = document.getElementById("modal-caption");

    function abrir({ src, alt, texto }) {
      modalImg.src = src;
      modalImg.alt = alt;
      modalCaption.innerHTML = marked.parse(texto);
      modalCaption.style.display = texto ? "block" : "none";
      modal.classList.add("active");
    }

    function cerrar() {
      modal.classList.remove("active");
      modalImg.src = "";
      modalCaption.textContent = "";
    }

    modal.addEventListener("click", cerrar);
    document.addEventListener("keydown", (e) => e.key === "Escape" && cerrar());

    // --- Constelación ---

    function nodos({ modo, items, edges, grupos }, barajado) {
      const { pos, etiquetas } = disponer(modo, items, edges, grupos, barajado);
      return [
        ...items.map((it) => {
          const origen = it.id === ORIGEN;
          return {
            id: it.id,
            type: "burbuja",
            position: pos.get(it.id),
            data: { ...it, origen, size: origen ? SIZE_ORIGEN : SIZE, onClick: () => abrir(it) },
          };
        }),
        ...etiquetas.map((e, i) => ({
          id: "etiqueta-" + i,
          type: "etiqueta",
          position: { x: e.x, y: e.y },
          draggable: false,
          data: e,
        })),
      ];
    }

    const idInicial = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      return PROPUESTAS.some((p) => p.id === h) ? h : PROPUESTAS[0].id;
    };

    function Constelacion({ propuestas }) {
      const [id, setId] = useState(idInicial);
      const [n, setN] = useState(0);
      const [verLectura, setVerLectura] = useState(true);
      const p = propuestas[id];
      const [nodes, setNodes] = useState(() => nodos(p, false));

      const elegir = (nuevo) => {
        history.replaceState(null, "", "#" + nuevo);
        setId(nuevo);
        setNodes(nodos(propuestas[nuevo], false));
        setN(n + 1);
      };
      const otra = () => {
        setNodes(nodos(p, true));
        setN(n + 1);
      };

      return html`
        <nav className="controles">
          <a href="index.html">Mosaico</a>
          <a href="bitacora.html">Bitácora</a>
          <span className="sep"></span>
          ${PROPUESTAS.map(
            (q) => html`
              <button
                type="button"
                key=${q.id}
                className=${q.id === id ? "activo" : ""}
                onClick=${() => elegir(q.id)}
              >${q.nombre}</button>
            `
          )}
          <span className="sep"></span>
          <button type="button" onClick=${otra}>Otra disposición</button>
          ${p.lectura && html`
            <button type="button" onClick=${() => setVerLectura(!verLectura)}>
              ${verLectura ? "Ocultar lectura" : "Lectura"}
            </button>
          `}
        </nav>
        <div className=${"lienzo" + (p.lectura && verLectura ? " con-lectura" : "")}>
          <${Diagrama} key=${id + "-" + n + "-" + verLectura} nodes=${nodes} edges=${p.edges} />
        </div>
        ${p.lectura && verLectura && html`
          <aside className="lectura">
            ${p.titulo && html`<h2>${p.titulo}</h2>`}
            <div className="modo">${MODOS[p.modo] ?? p.modo}</div>
            <div dangerouslySetInnerHTML=${{ __html: marked.parse(p.lectura) }} />
          </aside>
        `}
      `;
    }

    const texto = (url) => fetch(url, { cache: "no-store" }).then((r) => (r.ok ? r.text() : ""));
    const catalogo = parsearCatalogo(await texto("imagenes.md"));
    const mds = await Promise.all(PROPUESTAS.map((q) => texto(q.archivo)));
    const propuestas = Object.fromEntries(
      PROPUESTAS.map((q, i) => [q.id, parsear(mds[i], catalogo)])
    );
    createRoot(document.getElementById("constelacion")).render(
      html`<${Constelacion} propuestas=${propuestas} />`
    );
  </script>
</body>
</html>
