<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magos</title>
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .markdown-body {
      box-sizing: border-box;
      background-color: transparent !important;
      color: #c9d1d9 !important;
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background-color: transparent;
      margin-bottom: 8px;
    }

    .markdown-body a {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <main class="container">
    <article id="content" class="markdown-body"></article>
  </main>

  <script>
    async function loadMarkdown() {
      const container = document.getElementById('content');
      try {
        const response = await fetch('./buscador-magos/mago-imagenes.md');
        if (!response.ok) {
          throw new Error(`HTTP error ${response.status}`);
        }
        let text = await response.text();

        // Ajustar rutas relativas de las imágenes:
        // en mago-imagenes.md están como ./magos-img/... y deben resolverse desde la raíz como ./buscador-magos/magos-img/...
        text = text.replace(/\]\(\.\/magos-img\//g, '](./buscador-magos/magos-img/');

        container.innerHTML = marked.parse(text);
      } catch (err) {
        container.innerHTML = `<p>Error cargando mago-imagenes.md: ${err.message}</p>`;
      }
    }

    loadMarkdown();
  </script>
</body>
</html>
